# Same shape as F:/Goteav/backend/.github/actions/setup: Node + pnpm + cached store + install.
name: setup
description: Node 22, pnpm with cached store, frozen install
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
